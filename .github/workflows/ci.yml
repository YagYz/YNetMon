name: CI Build & Test (Dev -> Main PR)

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

jobs:
  test-build:
    name: Python Syntax & Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies & Verify Syntax
        run: |
          pip install -r requirements.txt
          python -m py_compile app/*.py

      - name: Test Docker Build (Dry-Run)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
